name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      POSTGRES_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://barber_app:barber_app_dev@localhost:5432/barber_voice
      DATABASE_ADMIN_URL: postgres://barber_owner:barber_owner_dev@localhost:5432/barber_voice
      TEST_DATABASE_URL: postgres://barber_app:barber_app_dev@localhost:5432/barber_voice_test
      TEST_DATABASE_ADMIN_URL: postgres://barber_owner:barber_owner_dev@localhost:5432/barber_voice_test
      DB_APP_ROLE: barber_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Papéis e bancos de teste
        run: pnpm db:bootstrap
      - name: Verificação de tipos
        run: pnpm typecheck
      - name: Testes (core, banco, contratos e API com PostgreSQL real)
        run: pnpm test
      - name: Build (API e painel)
        run: pnpm build
