# Produção econômica em UM servidor (VPS): painel, API, PostgreSQL, Redis, HTTPS e backup.
#
#   cp deploy/.env.prod.example deploy/.env   # preencha os valores
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Guia completo: docs/DEPLOYMENT.md (Opção C).
name: barber-voice

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  API_HOST: 0.0.0.0
  API_PORT: '4000'
  API_PATH_PREFIX: /api
  DATABASE_URL: postgres://barber_app:${DB_APP_PASSWORD}@postgres:5432/barber_voice
  DB_POOL_MAX: '10'
  REDIS_URL: redis://redis:6379
  WEB_ORIGIN: https://${DOMAIN}
  PUBLIC_WEB_URL: https://${DOMAIN}
  COOKIE_SECURE: 'true'
  # só o Caddy (rede interna) pode informar o IP real do cliente
  TRUST_PROXY: 172.30.0.0/24
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
  ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina POSTGRES_SUPERUSER_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?defina DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d barber_voice']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redisdata:/data
    networks: [internal]

  # Migrações + planos + personagens, antes de cada versão nova da API
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tools
    environment:
      NODE_ENV: production
      DATABASE_ADMIN_URL: postgres://barber_owner:${DB_OWNER_PASSWORD}@postgres:5432/barber_voice
      DB_APP_ROLE: barber_app
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    networks:
      internal:
        ipv4_address: 172.30.0.10

  # Backup diário do banco (formato custom do pg_dump), mantém os últimos 14 dias em ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/barber_voice-$$(date +%Y%m%d-%H%M).dump
          if pg_dump -h postgres -U barber_owner -d barber_voice -Fc -f "$$f"; then
            echo "backup ok: $$f"
          else
            echo "backup FALHOU" >&2; rm -f "$$f"
          fi
          find /backups -name 'barber_voice-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
